[package]
name = "xpar-ide"
version = "0.1.0"
edition = "2024"
description = "A lightweight TUI code editor for the Claude Code workflow"

[dependencies]
ropey = "1"
ratatui = "0.29"
crossterm = "0.28"
notify = "7"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
dirs-next = "2"
